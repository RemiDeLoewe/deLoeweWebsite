<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>de Loewe · Serveur injoignable</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Overpass:wght@300;400;700;900&family=Overpass+Mono:wght@600&display=swap" rel="stylesheet">

<style>
/* ================================================================
   COULEURS (les mêmes que HomeCloud)
   ================================================================ */
:root {
    --noir:    #000;
    --blanc:   #fff;
    --doux:    #6b6b6b;
    --ligne:   #d9d9d9;
    --survol:  #f3f3f3;
    --rouge:   #c62f45;
    --vert:    #1f8a4c;
    --accent:  #1fb5a5;
    --marge:   clamp(16px, 4vw, 56px);
    --mono:    "Overpass Mono", ui-monospace, Menlo, Consolas, monospace;
    --ressort: cubic-bezier(.2, .7, .2, 1);
}
@media (prefers-color-scheme: dark) {
    :root {
        --noir:   #fff;
        --blanc:  #0a0a0a;
        --doux:   #9a9a9a;
        --ligne:  #2e2e2e;
        --survol: #171717;
        --rouge:  #ff5c74;
        --vert:   #3cc47a;
        --accent: #40e0d0;
        color-scheme: dark;
    }
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
    margin: 0;
    font-family: "Overpass", system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    color: var(--noir);
    background: var(--blanc);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
}
a { color: inherit; }
::selection { background: var(--accent); color: #000; }
:focus-visible { outline: 3px solid var(--noir); outline-offset: 3px; }

/* ---------- Fond animé ---------- */
#fond { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none; }
body > *:not(#fond):not(script) { position: relative; z-index: 1; }

/* ---------- Header ---------- */
.entete {
    position: sticky;
    top: 0;
    z-index: 10 !important;
    background: var(--blanc);
    border-bottom: 1px solid var(--ligne);
}
.entete-dedans {
    max-width: 1280px;
    margin: 0 auto;
    padding: 16px var(--marge);
    min-height: 70px;          /* même hauteur que l'en-tête de HomeCloud (71 px avec la bordure) */
    display: flex;
    align-items: center;
    gap: 32px;
}
.marque { display: flex; align-items: center; text-decoration: none; }
.marque img { height: 32px; display: block; }
.nav { display: flex; align-items: center; gap: 22px; }
.nav a {
    position: relative;
    padding: 6px 0 3px;
    color: var(--doux);
    font-weight: 700;
    text-decoration: none;
    transition: color .2s;
}
.nav a::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: -1px;
    height: 2px;
    background: var(--noir);
    transform: scaleX(0);
    transform-origin: right;
    transition: transform .3s var(--ressort);
}
.nav a:hover, .nav .actif { color: var(--noir); }
.nav a:hover::after, .nav .actif::after { transform: scaleX(1); transform-origin: left; }

/* ---------- Boutons : le fond se remplit de gauche à droite ---------- */
.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 11px 20px 9px;
    border: 2px solid var(--noir);
    border-radius: 0;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    line-height: 1.2;
    text-decoration: none;
    cursor: pointer;
    color: var(--blanc);
    background: linear-gradient(var(--blanc), var(--blanc)) no-repeat 0 0 / 0% 100%, var(--noir);
    transition: background-size .3s var(--ressort), color .2s, transform .1s;
}
.btn:hover { background-size: 100% 100%; color: var(--noir); }
.btn:active { transform: translateY(1px); }
.btn-discret {
    color: var(--noir);
    background: linear-gradient(var(--noir), var(--noir)) no-repeat 0 0 / 0% 100%, var(--blanc);
}
.btn-discret:hover { color: var(--blanc); }
.btn .ic { width: 16px; height: 16px; transition: transform .3s var(--ressort); }
.btn:hover .ic { transform: translateX(3px); }

.ic { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ---------- Pied de page ---------- */
.pied {
    margin-top: auto;
    background: #000;
    color: #fff;
    border-top: 1px solid var(--ligne);
}
.pied-dedans {
    max-width: 1280px;
    margin: 0 auto;
    padding: 28px var(--marge);
    font-size: 15px;
}

/* ---------- Animations d'arrivée ---------- */
@keyframes apparait { from { opacity: 0; transform: translateY(14px); } }
@keyframes glisse   { from { opacity: 0; transform: translateX(-16px); } }
@keyframes barre    { from { transform: scaleX(0); } }

@media (max-width: 600px) {
    .entete-dedans { padding: 12px 16px; gap: 16px; }
}
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; animation-delay: 0s !important; transition-duration: .01ms !important; }
}
</style>

<style>
/* ---------- Contenu ---------- */
main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(32px, 8vh, 96px) var(--marge);
}
.carte {
    width: 100%;
    max-width: 520px;
    background: var(--blanc);
    border: 2px solid var(--noir);
    box-shadow: 12px 12px 0 var(--rouge);
    padding: clamp(24px, 4vw, 40px);
    animation: apparait .6s var(--ressort) backwards;
}
.carte .etat {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    margin: 0 0 18px;
    padding: 5px 12px 3px;
    border-radius: 999px;
    background: var(--rouge);
    color: #fff;
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .06em;
    text-transform: uppercase;
}
.etat::before {
    content: "";
    width: 8px; height: 8px;
    border-radius: 50%;
    background: currentColor;
    animation: clignote 1.2s steps(1) infinite;
}
@keyframes clignote { 50% { opacity: 0; } }
.carte h1 {
    margin: 0 0 14px;
    font-size: clamp(30px, 4.6vw, 46px);
    font-weight: 900;
    line-height: .98;
    letter-spacing: -0.035em;
    animation: glisse .55s .1s var(--ressort) backwards;
}
.carte p {
    margin: 0;
    color: var(--doux);
    line-height: 1.55;
}
.carte .retour {
    margin-top: 14px;
    color: var(--noir);
    font-family: var(--mono);
    font-size: 14px;
}
.actions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 28px;
}
/* l'icône de "Réessayer" tourne au survol */
.btn .ic.tourne { transition: transform .5s var(--ressort); }
.btn:hover .ic.tourne { transform: rotate(-200deg); }
@media (prefers-color-scheme: dark) {
    .carte .etat { color: #0a0a0a; }
}
@media (max-width: 600px) {
    .carte { box-shadow: 8px 8px 0 var(--rouge); }
    .actions .btn { flex: 1 1 auto; white-space: nowrap; }
}
</style>
</head>

<body>
<canvas id="fond" aria-hidden="true"></canvas>

<header class="entete">
    <div class="entete-dedans">
        <!-- IMPORTANT : URL ABSOLUE vers le logo servi par GitHub (deloewe.com),
             PAS un chemin relatif. Sinon, serveur éteint = logo cassé. -->
        <a class="marque" href="https://deloewe.com">
            <img src="https://deloewe.com/public/logo.png" alt="de Loewe">
        </a>
        <nav class="nav">
            <a href="https://deloewe.com">← Retour au site</a>
        </nav>
    </div>
</header>

<main>
    <div class="carte">
        <p class="etat" id="m-etat">Hors ligne</p>
        <h1 id="m-titre">Ce serveur est momentanément injoignable.</h1>
        <p id="m-texte">Le service sera de retour sous peu. Merci de réessayer plus tard,
           ou de contacter un administrateur du serveur.</p>
        <p class="retour" id="m-retour" hidden></p>

        <div class="actions">
            <button class="btn" onclick="location.reload()"><svg class="ic tourne" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg>Réessayer</button>
            <a class="btn btn-discret" href="https://deloewe.com">Retour à l'accueil</a>
        </div>
    </div>
</main>

<footer class="pied">
    <div class="pied-dedans">© de Loewe</div>
</footer>

<!-- Message choisi sur status.deloewe.com (onglet HomeCloud).
     Si status ne répond pas (serveur entier éteint), on garde le texte ci-dessus.
     Le texte est inséré avec textContent : jamais interprété comme du HTML. -->
<script>
(function () {
    const ctrl = new AbortController();
    setTimeout(() => ctrl.abort(), 4000);
    fetch("https://status.deloewe.com/public/message", { cache: "no-store", signal: ctrl.signal })
        .then(r => r.ok ? r.json() : null)
        .then(d => {
            const m = d && d.message;
            if (!m || !m.titre) return;
            if (m.etat) document.getElementById("m-etat").textContent = m.etat;
            document.getElementById("m-titre").textContent = m.titre;
            document.getElementById("m-texte").textContent = m.texte || "";
            document.title = "de Loewe · " + (m.etat || "Serveur injoignable");
            if (m.retour) {
                const t = new Date(m.retour);
                if (!isNaN(t)) {
                    const el = document.getElementById("m-retour");
                    const jour = t.toDateString() === new Date().toDateString() ? "aujourd'hui"
                        : t.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });
                    el.textContent = "Retour prévu : " + jour + " à " + t.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
                    el.hidden = false;
                }
            }
        })
        .catch(() => {});
})();
</script>

<!-- Sur cette page, les paquets sont rouges et se perdent en route -->
<script>window.FOND_OPTIONS = { couleur: "--rouge", coupure: true };</script>
<script>
/* =====================================================================
   FOND ANIMÉ : grille de points qui ondule, paquets qui circulent,
   grands carrés qui flottent. Réagit à la souris et au toucher.
   ===================================================================== */
(function () {
    const OPTIONS = window.FOND_OPTIONS || {};
    const reduit = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const cv = document.getElementById("fond"); if (!cv) return;
    const cx = cv.getContext("2d");
    let L = 0, H = 0, pas = 28, couleurs = {}, paquets = [], blocs = [];
    const t0 = performance.now(), souris = { x: -9999, y: -9999 }, ondes = [];

    function lireCouleurs() {
        const st = getComputedStyle(document.documentElement);
        couleurs = {
            point: st.getPropertyValue("--noir").trim() || "#000",
            paquet: st.getPropertyValue(OPTIONS.couleur || "--accent").trim() || "#1fb5a5"
        };
    }
    function nouveauPaquet() {
        const hor = Math.random() < .5;
        return {
            x: Math.round(Math.random() * L / pas) * pas + pas / 2,
            y: Math.round(Math.random() * H / pas) * pas + pas / 2,
            dx: hor ? (Math.random() < .5 ? 1 : -1) : 0, dy: hor ? 0 : (Math.random() < .5 ? 1 : -1),
            v: 1.2 + Math.random() * 1.6, trace: [],
            vie: 1, duree: OPTIONS.coupure ? 90 + Math.random() * 160 : Infinity, age: 0
        };
    }
    function taille() {
        const dpr = Math.min(2, devicePixelRatio || 1);
        L = innerWidth; H = innerHeight;
        cv.width = L * dpr; cv.height = H * dpr;
        cx.setTransform(dpr, 0, 0, dpr, 0, 0);
        pas = L < 600 ? 24 : 28;
        paquets = Array.from({ length: L < 600 ? 5 : 9 }, nouveauPaquet);
        blocs = Array.from({ length: L < 600 ? 4 : 7 }, (_, i) => ({
            x: Math.random() * L, y: Math.random() * H, c: 60 + Math.random() * (L < 600 ? 90 : 180),
            a: Math.random() * Math.PI, va: (Math.random() - .5) * .12,
            vx: (Math.random() - .5) * 10, vy: (Math.random() - .5) * 10, plein: i % 3 === 0
        }));
        lireCouleurs();
    }

    function dessiner(maintenant) {
        const t = (maintenant - t0) / 1000;
        cx.clearRect(0, 0, L, H);

        // grands carrés qui dérivent et tournent lentement
        for (const b of blocs) {
            if (!reduit) {
                b.x += b.vx / 60; b.y += b.vy / 60; b.a += b.va / 60;
                if (b.x < -b.c) b.x = L + b.c; if (b.x > L + b.c) b.x = -b.c;
                if (b.y < -b.c) b.y = H + b.c; if (b.y > H + b.c) b.y = -b.c;
            }
            cx.save(); cx.translate(b.x, b.y); cx.rotate(b.a);
            if (b.plein) { cx.globalAlpha = .06; cx.fillStyle = couleurs.point; cx.fillRect(-b.c / 2, -b.c / 2, b.c, b.c); }
            else { cx.globalAlpha = .16; cx.strokeStyle = couleurs.point; cx.lineWidth = 1.5; cx.strokeRect(-b.c / 2, -b.c / 2, b.c, b.c); }
            cx.restore();
        }

        // grille de points qui ondule
        cx.fillStyle = couleurs.point;
        for (let y = pas / 2; y < H + pas; y += pas) {
            for (let x = pas / 2; x < L + pas; x += pas) {
                const v = Math.sin(x * .011 + t * .7) + Math.cos(y * .013 - t * .55) + Math.sin((x + y) * .006 + t * .3);
                let r = 1 + (v + 3) / 6 * 1.6, a = .3 + (v + 3) / 6 * .42;
                let px = x + Math.cos(y * .02 + t) * 2, py = y + v * 5;
                const ddx = px - souris.x, ddy = py - souris.y, d = Math.hypot(ddx, ddy);
                if (d < 150) { const f = 1 - d / 150; px += ddx / (d || 1) * f * 14; py += ddy / (d || 1) * f * 14; r += f * 2.2; a += f * .45; }
                for (const o of ondes) {
                    const e = Math.abs(Math.hypot(x - o.x, y - o.y) - o.r);
                    if (e < 26) { const f = (1 - e / 26) * o.vie; r += f * 2.5; a += f * .5; }
                }
                cx.globalAlpha = Math.min(1, a);
                cx.fillRect(px - r / 2, py - r / 2, r, r);
            }
        }

        // paquets qui suivent les lignes de la grille (et se perdent si "coupure")
        cx.strokeStyle = couleurs.paquet; cx.fillStyle = couleurs.paquet; cx.lineWidth = 2;
        for (const p of paquets) {
            if (!reduit) {
                p.age++;
                if (p.age > p.duree) { p.vie -= .03; p.v *= .94; }
                p.x += p.dx * p.v; p.y += p.dy * p.v;
                p.trace.push([p.x, p.y]); if (p.trace.length > 34) p.trace.shift();
                const gx = (p.x - pas / 2) / pas, gy = (p.y - pas / 2) / pas;
                if (Math.abs(gx - Math.round(gx)) < .05 && Math.abs(gy - Math.round(gy)) < .05 && Math.random() < .18) {
                    if (p.dx) { p.dy = Math.random() < .5 ? 1 : -1; p.dx = 0; } else { p.dx = Math.random() < .5 ? 1 : -1; p.dy = 0; }
                }
                if (p.vie <= 0 || p.x < -60 || p.x > L + 60 || p.y < -60 || p.y > H + 60) Object.assign(p, nouveauPaquet());
            }
            for (let k = 1; k < p.trace.length; k++) {
                cx.globalAlpha = k / p.trace.length * .9 * Math.max(0, p.vie);
                cx.beginPath(); cx.moveTo(p.trace[k - 1][0], p.trace[k - 1][1]); cx.lineTo(p.trace[k][0], p.trace[k][1]); cx.stroke();
            }
            // un paquet perdu clignote avant de disparaître
            const clignote = p.age > p.duree && Math.floor(t * 8) % 2;
            cx.globalAlpha = clignote ? .2 : Math.max(0, p.vie);
            cx.fillRect(p.x - 3, p.y - 3, 6, 6);
        }

        for (let i = ondes.length - 1; i >= 0; i--) { const o = ondes[i]; o.r += 7; o.vie -= .012; if (o.vie <= 0) ondes.splice(i, 1); }
        cx.globalAlpha = 1;
        if (!reduit && !document.hidden) requestAnimationFrame(dessiner);
    }

    taille();
    addEventListener("resize", () => { taille(); if (reduit) dessiner(performance.now()); });
    addEventListener("pointermove", e => { souris.x = e.clientX; souris.y = e.clientY; }, { passive: true });
    document.addEventListener("pointerleave", () => { souris.x = souris.y = -9999; });
    addEventListener("pointerdown", e => { if (!reduit) ondes.push({ x: e.clientX, y: e.clientY, r: 0, vie: 1 }); }, { passive: true });
    matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { lireCouleurs(); if (reduit) dessiner(performance.now()); });
    document.addEventListener("visibilitychange", () => { if (!document.hidden && !reduit) requestAnimationFrame(dessiner); });
    requestAnimationFrame(dessiner);
})();
</script>
</body>
</html>
