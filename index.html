<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Redirection vers HostCloud</title>

    <link rel="canonical" href="https://hostcloud.deloewe.com">

    <meta http-equiv="refresh" content="0; url=https://hostcloud.deloewe.com">

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0f1117;
            color: white;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .box {
            text-align: center;
            padding: 40px;
            border-radius: 20px;
            background: #181b23;
            box-shadow: 0 10px 40px rgba(0,0,0,.4);
        }

        h1 {
            margin-bottom: 10px;
            font-size: 28px;
        }

        p {
            color: #aaa;
        }

        a {
            color: #66aaff;
            text-decoration: none;
        }
    </style>

    <script>
        window.location.replace("https://hostcloud.deloewe.com");
    </script>
</head>

<body>
    <div class="box">
        <h1>☁️ Redirection vers HostCloud</h1>
        <p>
            Vous allez être redirigé automatiquement...
        </p>
        <p>
            Si rien ne se passe :
            <br>
            <a href="https://hostcloud.deloewe.com">
                accéder à HostCloud
            </a>
        </p>
    </div>
</body>
</html>
