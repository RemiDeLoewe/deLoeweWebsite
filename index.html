<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>de Loewe. Hébergement et services auto-hébergés</title>

    <meta name="description"
        content="De Loewe : HomeCloud personnel et services auto-hébergés.">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Inter, system-ui, sans-serif;
            background:
                radial-gradient(circle at top, #1c3359 0%, #132544 35%, #0b1629 100%);
            color: white;
            padding: 30px 15px;
        }

        .card {
            width: min(92%, 540px);
            background: rgba(20, 28, 45, .82);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 26px;
            padding: 45px;
            text-align: center;
            box-shadow:
                0 30px 80px rgba(0,0,0,.45);
        }

        img.logo {
            width: 360px;
            max-width: 100%;
            margin-bottom: 45px;
        }

        /* ---------- Services ---------- */

        .services {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .service {
            background: rgba(255,255,255,.035);
            border: 1px solid rgba(255,255,255,.07);
            border-radius: 18px;
            padding: 22px;
            text-align: left;
        }

        .service h2 {
            font-size: 19px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .service p {
            margin-bottom: 18px;
            font-size: 14px;
            line-height: 1.55;
        }

        .btn {
            display: inline-block;
            width: 100%;
            padding: 17px;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            font-size: 17px;
            font-weight: 600;
            transition: .25s;
            text-decoration: none;
            text-align: center;
        }

        .primary {
            background: linear-gradient(135deg,#1fd0a0,#54d8ff);
            color: white;
        }

        .primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(84,216,255,.3);
        }

        .agenda {
            background: rgba(255,255,255,.05);
            color: white;
            border: 1px solid rgba(255,255,255,.1);
        }

        .agenda:hover {
            background: rgba(255,255,255,.09);
            transform: translateY(-2px);
        }

        hr {
            margin: 38px 0;
            border: none;
            border-top: 1px solid rgba(255,255,255,.08);
        }

        .connection-text {
            color: #b7c6dc;
            margin-bottom: 22px;
            line-height: 1.6;
        }

        .secondary {
            background: rgba(255,255,255,.05);
            color: white;
            border: 1px solid rgba(255,255,255,.08);
        }

        .secondary:hover {
            background: rgba(255,255,255,.09);
        }

        /* ---------- Popup ---------- */

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.55);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity .25s ease, visibility .25s ease;
            padding: 15px;
        }

        .overlay.open {
            opacity: 1;
            visibility: visible;
        }

        .popup {
            width: 400px;
            max-width: 92%;
            background: #132544;
            border-radius: 22px;
            padding: 35px;
            border: 1px solid rgba(255,255,255,.08);
            transform: translateY(20px) scale(.96);
            transition: transform .25s ease;
        }

        .overlay.open .popup {
            transform: none;
        }

        .login-error {
            display: none;
            margin-top: 12px;
            color: #ffd7dc;
            font-size: 14px;
            text-align: center;
        }

        .login-error .dot {
            color: #ff5a6e;
            margin-right: 6px;
        }

        .login-error.show {
            display: block;
        }

        .popup img {
            width: 180px;
            display: block;
            margin: auto;
            margin-bottom: 30px;
        }

        .popup h2 {
            text-align: center;
            margin-bottom: 25px;
            font-weight: 600;
        }

        input {
            width: 100%;
            margin-bottom: 15px;
            padding: 15px;
            border: none;
            outline: none;
            border-radius: 12px;
            background: #1b335a;
            color: white;
            font-size: 15px;
        }

        .popup button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            background: linear-gradient(135deg,#1fd0a0,#54d8ff);
            color: white;
            font-size: 16px;
            font-weight: 600;
        }

        .close {
            margin-top: 15px !important;
            background: transparent !important;
            border: 1px solid rgba(255,255,255,.1) !important;
        }
    </style>
</head>

<body>

    <div class="card">

        <img class="logo" src="./public/logo.png" alt="de Loewe">

        <div class="services">

            <div class="service">
                <h2>☁️ HomeCloud</h2>

                <p>
                    Accédez à votre espace de stockage personnel.
                </p>

                <a class="btn primary"
                   href="https://homecloud.deloewe.com">
                    Aller sur HomeCloud
                </a>
            </div>

            

        </div>


    </div>

    

    </div>

    <script>
        function login() {
            document.getElementById("overlay").classList.add("open");
        }

        function closeLogin() {
            document.getElementById("overlay").classList.remove("open");
            document.getElementById("loginError").classList.remove("show");
        }

        document.getElementById("overlay").addEventListener("click", e => {
            if (e.target.id === "overlay") {
                closeLogin();
            }
        });

        function Connexion() {
            document.getElementById("loginError").classList.add("show");
        }
    </script>

</body>
</html>
