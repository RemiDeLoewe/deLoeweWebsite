<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>de Loewe · Serveur injoignable</title>

<style>
/* ================================================================
   COULEURS (les mêmes que HomeCloud)
   ================================================================ */
:root {
    --fond:        #0e1a2e;
    --fond-entete: #0a1424;
    --panneau:     #13233b;
    --panneau-2:   #182b47;
    --ligne:       #233756;
    --texte:       #e8edf4;
    --discret:     #8ea3bd;
    --turquoise:   #40e0d0;
    --turquoise-2: #2bc4b3;
    --rouge:       #e8667a;
}

* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: system-ui, "Segoe UI", Ubuntu, "Noto Sans", Arial, sans-serif;
    font-size: 15px;
    color: var(--texte);
    background: var(--fond);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}


/* ---------- Header ---------- */
.entete {
    background: var(--fond-entete);
    border-bottom: 1px solid var(--ligne);
}
.entete-dedans {
    max-width: 1000px;
    margin: 0 auto;
    padding: 10px 24px;
    display: flex;
    align-items: center;
    gap: 28px;
}
.marque img {
    height: 34px;
    display: block;
}
.nav a {
    padding: 8px 10px;
    color: var(--discret);
    text-decoration: none;
    font-weight: 500;
}
.nav a:hover { color: var(--texte); }


/* ---------- Contenu ---------- */
main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
}
.carte {
    width: 100%;
    max-width: 460px;
    background: var(--panneau);
    border: 1px solid var(--ligne);
    border-left: 3px solid var(--rouge);
    border-radius: 10px;
    padding: 24px;
}

<head>

<title>de Loewe · Serveur injoignable</title>

<style>
/* ================================================================
   COULEURS (les mêmes que HomeCloud)
   ================================================================ */
:root {
    --noir:    #000;
    --blanc:   #fff;
    --doux:    #6b6b6b;
    --ligne:   #d9d9d9;
    --survol:  #f3f3f3;
    --rouge:   #c62f45;
    --vert:    #1f8a4c;
    --accent:  #1fb5a5;
    --marge:   clamp(16px, 4vw, 56px);
    --mono:    "Overpass Mono", ui-monospace, Menlo, Consolas, monospace;
    --ressort: cubic-bezier(.2, .7, .2, 1);
}
@media (prefers-color-scheme: dark) {
    :root {
        --noir:   #fff;
        --blanc:  #0a0a0a;
        --doux:   #9a9a9a;
        --ligne:  #2e2e2e;
.etat {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0 0 6px;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .6px;
    color: var(--rouge);
}
.etat::before {
    content: "";
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--rouge);
}
.carte h1 {
    margin: 0 0 10px;
    font-size: 20px;
}
.carte p {
    margin: 0;
    color: var(--discret);
    line-height: 1.6;
    font-size: 14px;
}
.actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 20px;
}


/* ---------- Boutons ---------- */
.btn {
    display: inline-block;
    padding: 9px 16px;
    border: 1px solid transparent;
    border-radius: 8px;
    font-family: inherit;
    font-weight: 600;
    font-size: 14px;
    text-decoration: none;
    cursor: pointer;
    background: var(--turquoise);
    color: #0b1a2c;
    transition: background .15s;
}
.btn:hover { background: var(--turquoise-2); }
.btn-discret {
    background: transparent;
    border-color: var(--ligne);
    <p>Le service sera de retour sous peu. Merci de réessayer plus tard,
           ou de contacter un administrateur du serveur.</p>

        <div class="actions">
            <button class="btn" onclick="location.reload()">Réessayer</button>
            <a class="btn btn-discret" href="https://deloewe.com">Retour à l'accueil</a>
        </div>
    </div>
</main>

<footer class="pied">
    © de Loewe

</body>
